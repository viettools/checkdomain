services:
    web:
        build: .
        image: checkdomain:4.x.x
        container_name: check_domain
        command: python3 /data/checkdomain/main.py
        volumes:
            - .:/data/checkdomain
        ports:
            - "127.0.0.1:6996:6996"
        networks:
            - checkdomainnet
        restart: always

networks:
    checkdomainnet:
        external: true